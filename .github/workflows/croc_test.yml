name: Croc frontend + backend

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/croc_test.yml'

permissions:
  contents: read

jobs:
  croc:
    name: Verilator helloworld + Yosys synthesis
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      CROC_REPO: https://github.com/pulp-platform/croc.git
      CROC_REF: main

    steps:
      - name: 0. Checkout this repository
        uses: actions/checkout@v4

      - name: 1. Install system packages
        shell: bash
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl wget xz-utils \
            verilator yosys \
            gcc-riscv64-unknown-elf \
            make gawk

      - name: 2. Clone Croc repository
        shell: bash
        run: |
          set -x
          git clone --depth 1 --branch ${{ env.CROC_REF }} ${{ env.CROC_REPO }} croc
          cd croc
          git rev-parse HEAD

      - name: 3. Run Verilator simulation (Frontend)
        shell: bash
        run: |
          set -x
          cd croc/verilator
          make verilator
          make helloworld

      - name: 4. Run Yosys synthesis (Backend)
        shell: bash
        run: |
          set -x
          cd croc/verilator
          make yosys

      - name: 5. Show simulation logs
        shell: bash
        run: |
          echo "====== Simulator output ======"
          find croc/verilator -name "*.log" -exec cat {} +
