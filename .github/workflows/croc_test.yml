name: Croc frontend + backend

# 手动点运行：Actions 页面 -> 左侧 "Croc frontend + backend" -> Run workflow
"on":
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  croc:
    name: Verilator helloworld + Yosys synthesis
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      # 固定上游仓库，避免跟着 main 漂移
      CROC_REPO: https://github.com/pulp-platform/croc.git
      CROC_REF: main
      # Bender 版本（croc 要求 >= 0.28.2，这里固定 0.32.1）
      BENDER_VERSION: v0.32.1

    steps:
      - name: 0. Checkout this repository
        uses: actions/checkout@v4

      - name: 1. Install system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl wget xz-utils \
            verilator \
            make gawk \
            imagemagick fonts-dejavu-core \
            gcc-riscv64-unknown-elf \
            picolibc-riscv64-unknown-elf
          # 说明：Ubuntu 的 gcc-riscv64-unknown-elf 只带编译器，不带 C 库，
          # 所以链接时 -lm 会报 cannot find -lm。libm.a 由 picolibc 提供，
          # 装好后位于 /usr/lib/picolibc/riscv64-unknown-elf/lib 下面。
          # 万一上面的包名在这个 Ubuntu 版本里不存在，就从源里按名字找替代品
          if ! command -v riscv64-unknown-elf-gcc > /dev/null 2>&1; then
            echo "[WARN] gcc-riscv64-unknown-elf 没装上，尝试从软件源里搜替代包"
            ALT_PKG="$(apt-cache search '^gcc-riscv64' 2>/dev/null | awk '{print $1}' | head -n 1 || true)"
            echo "[INFO] 搜到的替代包: ${ALT_PKG:-<无>}"
            if [ -n "$ALT_PKG" ]; then
              sudo apt-get install -y --no-install-recommends "$ALT_PKG" || true
            fi
          fi
          mkdir -p logs
          echo "=== installed versions ==="
          { verilator --version
            riscv64-unknown-elf-gcc --version | head -n 1
            make --version | head -n 1
            convert --version | head -n 3
          } 2>&1 | tee logs/backend_00_tool_versions.txt

      - name: 2. Clone croc and install Bender
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$CROC_REF" "$CROC_REPO" croc
          cd croc
          echo "[INFO] croc commit: $(git rev-parse HEAD)"
          git rev-parse HEAD > ../logs/croc_commit.txt
          cd "$GITHUB_WORKSPACE"

          mkdir -p /tmp/bender_extract
          WS="${GITHUB_WORKSPACE:-$PWD}"
          mkdir -p "$WS/logs"
          if curl -fsSL -o /tmp/bender.tar.xz \
               "https://github.com/pulp-platform/bender/releases/download/${BENDER_VERSION}/bender-x86_64-unknown-linux-gnu.tar.xz"; then
            echo "[INFO] release tarball downloaded"
            tar -xJf /tmp/bender.tar.xz -C /tmp/bender_extract
          else
            echo "[WARN] release tarball download failed, falling back to the official installer"
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://github.com/pulp-platform/bender/releases/download/${BENDER_VERSION}/bender-installer.sh" \
              | sh -s -- --no-modify-path
          fi

          # 不管哪种方式装的，都把 bender 找出来（tarball 里会多套一层目录，
          # 之前就是因为写死了路径才报 No such file or directory）
          BENDER_BIN=""
          for d in /tmp/bender_extract "$HOME/.local/bin" "$HOME/.cargo/bin"; do
            [ -d "$d" ] || continue
            found="$(find "$d" -type f \( -name bender -o -name bender.exe \) 2>/dev/null | head -n 1 || true)"
            if [ -n "$found" ]; then BENDER_BIN="$found"; break; fi
          done

          if [ -z "$BENDER_BIN" ]; then
            echo "[INFO] 没找到二进制，先跑一次官方安装脚本兜底"
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://github.com/pulp-platform/bender/releases/download/${BENDER_VERSION}/bender-installer.sh" \
              | sh -s -- --no-modify-path || true
            for d in "$HOME/.cargo/bin" "$HOME/.local/bin"; do
              [ -d "$d" ] || continue
              found="$(find "$d" -type f -name bender 2>/dev/null | head -n 1 || true)"
              if [ -n "$found" ]; then BENDER_BIN="$found"; break; fi
            done
          fi

          if [ -z "$BENDER_BIN" ]; then
            echo "[ERROR] 找不到 bender 可执行文件" >&2
            find /tmp/bender_extract -maxdepth 3 -print 2>/dev/null || true
            ls -la "$HOME/.local/bin" 2>/dev/null || true
            exit 1
          fi

          echo "[INFO] found bender at: $BENDER_BIN"
          chmod +x "$BENDER_BIN"
          mkdir -p "$HOME/.local/bin"
          cp -f "$BENDER_BIN" "$HOME/.local/bin/bender"
          chmod +x "$HOME/.local/bin/bender"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          echo "=== bender self-report ==="
          bender --version 2>&1 | tee "$WS/logs/00_bender_version.txt"
          bender --help > /dev/null
          echo "OK: bender 可用"

      - name: 2.5. Sanity check that this is really the croc repository
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] pwd=$(pwd)"
          echo "=== top level of croc ==="
          ls -1 croc | tee logs/00_croc_top_level.txt
          # 这些文件是后面每一步的前提，缺任何一个都在这里立刻报出来，
          # 而不是等到某个 make 命令抛出看不懂的错误
          test -d croc/verilator || { echo "[ERROR] croc/verilator 目录不存在" >&2; exit 1; }
          test -f croc/verilator/run_verilator.sh || { echo "[ERROR] 缺少 croc/verilator/run_verilator.sh" >&2; exit 1; }
          test -f croc/sw/Makefile || { echo "[ERROR] 缺少 croc/sw/Makefile" >&2; exit 1; }
          test -f croc/yosys/run_synthesis.sh || { echo "[ERROR] 缺少 croc/yosys/run_synthesis.sh" >&2; exit 1; }
          test -f croc/env.sh || { echo "[ERROR] 缺少 croc/env.sh" >&2; exit 1; }
          echo "OK: 关键文件齐全"
          # bender 是生成文件清单的唯一手段：仓库里没有预先算好的 croc_rtl.f，
          # 也没有哪个 Makefile 目标能替代它。
          command -v bender || { echo "[ERROR] bender 不在 PATH 里" >&2; exit 1; }
          bender --version
          echo "OK: bender 在 PATH 里可用"
          # verilator 目录下没有 Makefile，所以绝对不能用 'make' 来编译硬件。
          # 硬件编译走 run_verilator.sh --build。
          if [ -f croc/verilator/Makefile ]; then
            echo "[WARN] 意外发现 croc/verilator/Makefile，请确认上游结构是否变了"
          else
            echo "OK: 确认 croc/verilator 下没有 Makefile，硬件编译必须用 ./run_verilator.sh --build"
          fi

      - name: 3. Build the RTL file list with Bender
        shell: bash
        run: |
          set -euo pipefail
          cd croc/verilator
          ./run_verilator.sh --flist-rtl 2>&1 | tee "$GITHUB_WORKSPACE/logs/frontend_01_flist.log"
          echo "=== head of generated croc_rtl.f ==="
          head -n 10 croc_rtl.f | tee "$GITHUB_WORKSPACE/logs/frontend_01_flist_head.txt"

      - name: "3.5. Download OSS CAD Suite (Yosys + slang plugin, and a Verilator fallback)"
        shell: bash
        run: |
          set -euo pipefail
          # croc 的 yosys 脚本需要 'yosys plugin -i slang.so'，Ubuntu 自带的 yosys 没有 slang。
          # OSS CAD Suite 自带 yosys + slang.so + abc，所以后端用它。
          # 它同时带来一个较新的 verilator，万一 apt 那个太旧就跑不动。
          URL="$(curl -fsSL https://api.github.com/repos/YosysHQ/oss-cad-suite-build/releases/latest \
            | grep -o 'https://[^"]*oss-cad-suite-linux-x64-[0-9]*\.tgz' | head -n 1)"
          if [ -z "$URL" ]; then
            echo "[ERROR] could not resolve OSS CAD Suite asset URL" >&2
            exit 1
          fi
          echo "[INFO] OSS CAD Suite URL: $URL"
          echo "$URL" > "$GITHUB_WORKSPACE/logs/backend_00_oss_cad_suite_url.txt"
          curl -fL --retry 3 -o /tmp/oss-cad-suite.tgz "$URL"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$GITHUB_WORKSPACE"
          rm -f /tmp/oss-cad-suite.tgz
          "$GITHUB_WORKSPACE/oss-cad-suite/bin/yosys" -V | tee logs/backend_00_yosys_version.txt
          "$GITHUB_WORKSPACE/oss-cad-suite/bin/verilator" --version | tee logs/frontend_00_suite_verilator_version.txt

      - name: "4. FRONTEND: cross-compile helloworld (riscv64-unknown-elf-gcc)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs

          # 找编译器，多试几个名字
          REAL_CC=""
          for c in riscv64-unknown-elf-gcc riscv64-unknown-elf-gcc-13 \
                   riscv64-unknown-elf-gcc-12 riscv32-unknown-elf-gcc; do
            if command -v "$c" > /dev/null 2>&1; then REAL_CC="$(command -v "$c")"; break; fi
          done
          if [ -z "$REAL_CC" ]; then
            echo "[ERROR] 没找到 RISC-V 交叉编译器" >&2
            exit 1
          fi
          # 必须是绝对路径：包装脚本会把自己放到 PATH 最前面，
          # 如果这里存的是裸命令名，包装脚本就会调用它自己，无限递归，
          # 表现就是 "cannot execute 'cc1': execvp: No such file or directory"。
          echo "[INFO] 真实编译器绝对路径: $REAL_CC"
          "$REAL_CC" --version 2>&1 | head -n 1 | tee logs/frontend_02b_compiler_version.txt

          # 检查 C 库到底在哪。
          # Ubuntu 的 gcc-riscv64-unknown-elf 不带 C 库，libm.a 来自 picolibc 包，
          # 装在 /usr/lib/picolibc/... 下面，而编译器默认不会去那里找，所以 -lm 会失败。
          echo "=== 查找 libm.a ==="
          PKG_M=""
          for archdir in lib/rv32i/ilp32 lib/rv32im/ilp32 lib/release; do
            for libdir in /usr/lib/picolibc/riscv64-unknown-elf /usr/lib/picolibc/riscv32-unknown-elf; do
              cand="$libdir/$archdir"
              if [ -f "$cand/libm.a" ]; then PKG_M="$cand"; break 2; fi
            done
          done
          if [ -z "$PKG_M" ]; then
            PKG_M="$(dirname "$(find /usr/lib/picolibc -name 'libm.a' 2>/dev/null | head -n 1 || true)")"
          fi
          echo "[INFO] picolibc 库目录: ${PKG_M:-<没找到>}"
          if [ -n "$PKG_M" ]; then
            ls -1 "$PKG_M" | head -n 20 | tee logs/frontend_02d_picolibc_libs.txt
          fi
          {
            find /usr/lib/picolibc -name 'libm.a' 2>/dev/null | head -n 20 || true
            echo "--- 默认搜索路径 ---"
            echo | "$REAL_CC" -march=rv32i_zicsr -mabi=ilp32 -E -Wp,-v - 2>&1 | grep -E '^ /' || true
          } | tee logs/frontend_02e_search_paths.txt

          # 试链接一下，看 -L 之后 -lm 能不能找到。
          # 具体架构目录和大目录都加上：libm.a 在架构目录里，libc.a 在大目录里。
          LIB_PATHS="$PKG_M"
          base_dir="$(dirname "$PKG_M" 2>/dev/null || true)"
          if [ -n "$base_dir" ] && [ "$base_dir" != "$PKG_M" ] && [ -d "$base_dir" ]; then
            LIB_PATHS="$LIB_PATHS $base_dir"
          fi

          if [ -n "$PKG_M" ]; then
            cat > /tmp/probe.c <<'PROBEEOF'
          int main(void) { return 0; }
          PROBEEOF
            probe_args=""
            for p in $LIB_PATHS; do
              probe_args="$probe_args -L$p"
            done
            if "$REAL_CC" -march=rv32i_zicsr -mabi=ilp32 -nostdlib -nostartfiles /tmp/probe.c \
                 $probe_args -lm -lgcc -o /tmp/probe.elf > /dev/null 2>&1; then
              echo "OK: 试链接通过，-lm 可以找到"
            else
              echo "[WARN] 试链接没通过，照常编译，看真实报错"
            fi
          fi

          echo "=== 源文件和构建目录 ==="
          cd croc/sw
          ls -la | tee "$GITHUB_WORKSPACE/logs/frontend_02c_sw_dir.txt"
          for f in Makefile crt0.S link.ld helloworld.c; do
            test -f "$f" || { echo "[ERROR] 缺少 sw/$f" >&2; exit 1; }
          done
          test -d lib/src || { echo "[ERROR] 缺少 sw/lib/src（源码可能不完整）" >&2; exit 1; }
          test -d lib/inc || { echo "[ERROR] 缺少 sw/lib/inc" >&2; exit 1; }
          echo "OK: sw 目录内容齐全"

          WRAP_ARGS=""
          for p in $LIB_PATHS; do
            [ -n "$p" ] && WRAP_ARGS="$WRAP_ARGS -L$p"
          done
          echo "[INFO] 编译时会额外传入:${WRAP_ARGS:- <无>}"

          echo "=== 开始编译 ==="
          set +e
          if [ -n "$WRAP_ARGS" ]; then
            # 用一层包装脚本把 -L<picolibc 路径> 补到每次编译和链接调用上。
            # 这里必须写 REAL_CC 的绝对路径，否则脚本会调用它自己导致无限递归。
            WRAP="$GITHUB_WORKSPACE/ccwrap"
            mkdir -p "$WRAP"
            printf '#!/bin/sh\nREAL=%s\n[ "$1" = "--version" ] && exec "$REAL" "$@"\nexec "$REAL" %s "$@"\n' \
              "$REAL_CC" "$WRAP_ARGS" > "$WRAP/riscv64-unknown-elf-gcc"
            chmod +x "$WRAP/riscv64-unknown-elf-gcc"
            echo "[INFO] 包装脚本内容:"; cat "$WRAP/riscv64-unknown-elf-gcc"
            # 先自己验证一次包装脚本能正常工作，再交给 make
            "$WRAP/riscv64-unknown-elf-gcc" -march=rv32i_zicsr -mabi=ilp32 -c /tmp/probe.c -o /tmp/probe.o \
              && echo "OK: 包装脚本可以正常调用真实编译器" \
              || { echo "[ERROR] 包装脚本自身就调不通，放弃包装" >&2; WRAP_ARGS=""; }
            if [ -n "$WRAP_ARGS" ]; then
              export PATH="$WRAP:$PATH"
            fi
          fi
          make clean > /dev/null 2>&1 || true
          make all 2>&1 | tee "$GITHUB_WORKSPACE/logs/frontend_02_sw_build.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            cp -f "$GITHUB_WORKSPACE/logs/frontend_02_sw_build.log" \
                  "$GITHUB_WORKSPACE/logs/frontend_02_sw_build_FAILED.log"
            echo "[ERROR] 交叉编译失败，完整报错见 logs/frontend_02_sw_build_FAILED.log" >&2
            tail -n 60 "$GITHUB_WORKSPACE/logs/frontend_02_sw_build_FAILED.log" >&2
            exit 1
          fi

          echo "=== 编译产物 ==="
          ls -l bin/ | tee "$GITHUB_WORKSPACE/logs/frontend_02_sw_bin.txt"
          test -s bin/helloworld.hex || { echo "[ERROR] 没有生成 bin/helloworld.hex" >&2; exit 1; }
          echo "OK: bin/helloworld.hex 已生成"

      - name: "4.5. Patch ts_sram.sv so Verilator can compile it (BLKLOOPINIT)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          # Verilator 报 %Error-BLKLOOPINIT：
          #   ts_sram.sv:152 Unsupported: Delayed assignment to array inside for loops
          #          (non-delayed is ok - see docs)
          # 注意它写的是 "Unsupported"，不是普通告警，所以 -Wno-BLKLOOPINIT 这类
          # 开关关不掉它——Verilator 是真的不会为这种写法生成代码。
          # Verilator 自己的提示就是出路：把延迟赋值 <= 换成非延迟赋值 =。
          # 这里在 CI 里就地打这个补丁，并把 diff 打出来存证。
          mapfile -t SRAM_FILES < <(find croc -name 'ts_sram.sv' -type f 2>/dev/null)
          if [ "${#SRAM_FILES[@]}" -eq 0 ]; then
            echo "[ERROR] 找不到 ts_sram.sv" >&2
            exit 1
          fi
          for f in "${SRAM_FILES[@]}"; do
            echo "[INFO] patch $f"
            cp -f "$f" "$f.orig"
            # 只改第 140-175 行区间，正好覆盖那个 for 循环里的写端口赋值
            perl -i -pe 's/<=/=/g if $. >= 140 && $. <= 175' "$f"
            echo "--- diff ---"
            diff -u "$f.orig" "$f" | tee -a "$GITHUB_WORKSPACE/logs/frontend_02f_sram_patch.diff" || true
          done
          echo "=== 补丁后第 145-160 行 ==="
          sed -n '145,160p' "${SRAM_FILES[0]}" | tee "$GITHUB_WORKSPACE/logs/frontend_02g_sram_patched.txt"
          # 确认那个延迟赋值真的没了；如果还在，就让这一步直接失败，别把问题拖到 Verilator
          if sed -n '140,175p' "${SRAM_FILES[0]}" | grep -q 'sram\[d\]\[i\].*<='; then
            echo "[ERROR] 补丁没生效，仍然存在 <= 赋值，请检查 ts_sram.sv 的行号是否变了" >&2
            exit 1
          fi
          echo "OK: ts_sram.sv 补丁完成"

      - name: "5. FRONTEND: Verilator build (this is the compile step)"
        shell: bash
        run: |
          set -euo pipefail
          cd croc/verilator

          # 只用系统自带的 verilator（第 1 步 apt 装的那个）。
          # 之前这里有个"失败就用 OSS CAD Suite verilator 重试"的兜底，
          # 那个兜底设了 LD_LIBRARY_PATH=oss-cad-suite/lib，导致 verilator
          # 加载到不配套的库，连 --version 都直接段错误，所以删掉了。
          # OSS CAD Suite 只为后端的 slang 保留，前端不碰它。
          #
          # 关于 %Error-BLKLOOPINIT（ts_sram.sv 的延迟数组赋值）：
          # 那个是 Verilator 的 Unsupported 错误，加任何 -Wno-* 都关不掉，
          # 已经在第 4.5 步就地打补丁把它改成了非延迟赋值。
          echo "=== verilator 信息 ==="
          which verilator
          verilator --version | tee "$GITHUB_WORKSPACE/logs/frontend_00_apt_verilator_version.txt"
          echo "[INFO] LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<空>}"

          echo "=== 开始 Verilator 编译 ==="
          set +e
          VERILATOR_JOBS=4 ./run_verilator.sh --build 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            # verilator 的报错细节默认不刷屏，只给一个 "Exiting due to N error(s)" 摘要。
            # 上次抓取时被大量 UNOPTFLAT 警告淹没，所以这次先只抓 Error，
            # 并把 Error 那一行连同它后面 8 行（真正的说明文字）一起打出来。
            echo "=== 用 --error-limit 重新跑一次，让 verilator 把报错细节打出来 ==="
            set +e
            verilator -Wno-fatal -Wno-style -Wno-BLKANDNBLK -Wno-WIDTHEXPAND \
              -Wno-WIDTHTRUNC -Wno-WIDTHCONCAT -Wno-ASCRANGE \
              --timing --error-limit 50 --top tb_croc_soc \
              --lint-only -f croc_rtl.f 2>&1 | tee -a "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log"
            set -e
            {
              echo "########## Error 行 + 紧接的 8 行（窗口调窄，避免网页截断） ##########"
              grep -n -A 8 '%Error' "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log" || true
              echo "########## 报错总行数 ##########"
              grep -c '%Error' "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log" || true
              echo "########## 第一处 Error 之前的 6 行（原始上下文） ##########"
              ln="$(grep -n '%Error' "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log" | head -n 1 | cut -d: -f1 || true)"
              if [ -n "$ln" ]; then
                start=$(( ln > 6 ? ln - 6 : 1 ))
                sed -n "${start},$(( ln + 8 ))p" "$GITHUB_WORKSPACE/logs/frontend_03_verilator_build.log"
              fi
            } 2>&1 | tee "$GITHUB_WORKSPACE/logs/frontend_03_verilator_errors.txt"
            echo "[ERROR] Verilator 编译失败（rc=$rc），完整日志见 logs/frontend_03_verilator_build.log" >&2
            exit 1
          fi

          echo "=== Verilator 编译输出 ==="
          ls -l obj_dir_rtl/ | tee "$GITHUB_WORKSPACE/logs/frontend_03_obj_dir.txt"
          test -x obj_dir_rtl/Vtb_croc_soc \
            || { echo "[ERROR] 没有生成 obj_dir_rtl/Vtb_croc_soc" >&2; exit 1; }
          echo "OK: 仿真程序 obj_dir_rtl/Vtb_croc_soc 已生成"

      - name: "6. FRONTEND: run helloworld simulation"
        shell: bash
        run: |
          set -euo pipefail
          cd croc/verilator
          ./run_verilator.sh --run ../sw/bin/helloworld.hex 2>&1 | tee "$GITHUB_WORKSPACE/logs/frontend_04_helloworld_run.log"

      - name: 7. Verify frontend really succeeded
        shell: bash
        run: |
          set -euo pipefail
          LOG=logs/frontend_04_helloworld_run.log
          echo "=== looking for hard evidence in $LOG ==="
          grep -n "Running program" "$LOG" || true
          grep -n "Hello World from Croc!" "$LOG" || true
          grep -n "Simulation finished: SUCCESS" "$LOG" || true
          echo "=== assertions ==="
          grep -q "Hello World from Croc!" "$LOG"
          echo "OK: UART printed the hello world line"
          grep -q "Simulation finished: SUCCESS" "$LOG"
          echo "OK: simulation reported SUCCESS"
          test -x croc/verilator/obj_dir_rtl/Vtb_croc_soc
          echo "OK: simulation binary exists"
          ls -l croc/verilator/obj_dir_rtl/Vtb_croc_soc
          echo "[FRONTEND] PASSED"

      - name: "8. BACKEND: confirm Yosys and the slang plugin are available"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/oss-cad-suite/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/oss-cad-suite/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          yosys -V
          # croc 的 yosys_synthesis.tcl 里有 'yosys plugin -i slang.so'，缺了它一定失败
          test -f "$GITHUB_WORKSPACE/oss-cad-suite/lib/slang.so" \
            || test -f "$GITHUB_WORKSPACE/oss-cad-suite/share/yosys/slang.so" \
            || { echo "[ERROR] slang.so not found in OSS CAD Suite" >&2; find "$GITHUB_WORKSPACE/oss-cad-suite" -name 'slang.so' -print; exit 1; }
          echo "OK: slang.so present"
          find "$GITHUB_WORKSPACE/oss-cad-suite" -name 'slang.so' -print | tee logs/backend_00_slang_path.txt

      - name: "9. BACKEND: Yosys synthesis (RTL -> gate-level netlist)"
        shell: bash
        run: |
          set -euo pipefail
          # 这里把 OSS CAD Suite 放到 PATH 前面，让它的 yosys 生效
          export PATH="$GITHUB_WORKSPACE/oss-cad-suite/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/oss-cad-suite/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          yosys -V
          cd croc/yosys
          ./run_synthesis.sh --synth 2>&1 | tee "$GITHUB_WORKSPACE/logs/backend_01_yosys_synthesis.log"
          # 把 croc 自己产生的日志一起收走
          cp -v croc.log "$GITHUB_WORKSPACE/logs/backend_02_croc_yosys_internal.log"
          mkdir -p "$GITHUB_WORKSPACE/logs/yosys_reports"
          cp -v reports/*.rpt "$GITHUB_WORKSPACE/logs/yosys_reports/"
          ls -l out/ | tee "$GITHUB_WORKSPACE/logs/backend_03_yosys_out.txt"

      - name: 10. Verify backend really succeeded
        shell: bash
        run: |
          set -euo pipefail
          test -s croc/yosys/out/netlist_debug.v
          echo "OK: croc/yosys/out/netlist_debug.v exists"
          test -s croc/yosys/out/croc_yosys.v
          echo "OK: croc/yosys/out/croc_yosys.v exists"
          echo "=== netlist head ==="
          head -n 5 croc/yosys/out/croc_yosys.v | tee logs/backend_04_netlist_head.txt
          echo "=== area report (tail) ==="
          ls logs/yosys_reports/
          tail -n 40 logs/yosys_reports/croc_area.rpt | tee logs/backend_05_area_report_tail.txt
          echo "[BACKEND] PASSED"

      - name: 11. Make PNG proof images from the terminal logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          # fonts-dejavu-core 装好后用完整字体路径，比字体名更不容易出错
          MONO_TTF="$(find /usr/share/fonts -name 'DejaVuSansMono.ttf' | head -n 1)"
          echo "[INFO] mono font: ${MONO_TTF:-<none, falling back to default>}"
          fixup() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r$//' "$1" | cut -c1-170; }
          render() {
            local src="$1" out="$2" title="$3"
            if [ -n "$MONO_TTF" ]; then
              fixup "$src" | tail -n 38 | convert \
                -background '#101418' -fill '#e6e6e6' \
                -font "$MONO_TTF" -pointsize 15 \
                -bordercolor '#101418' -border 18 \
                label:"$ $title\n$(cat)" "$out"
            else
              fixup "$src" | tail -n 38 | convert \
                -background '#101418' -fill '#e6e6e6' \
                -pointsize 15 -bordercolor '#101418' -border 18 \
                label:"$ $title\n$(cat)" "$out"
            fi
            echo "[OK] wrote $out"
          }
          render logs/frontend_03_verilator_build.log logs/01_frontend_verilator_compile.png \
            "cd croc/verilator && ./run_verilator.sh --build"
          render logs/frontend_04_helloworld_run.log logs/02_frontend_helloworld_run.png \
            "cd croc/verilator && ./run_verilator.sh --run ../sw/bin/helloworld.hex"
          render logs/backend_01_yosys_synthesis.log logs/03_backend_yosys_synthesis.png \
            "cd croc/yosys && ./run_synthesis.sh --synth"
          ls -l logs/*.png

      - name: 12. Pack evidence bundle (logs + reports + proof images)
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp -v logs/*.png evidence/ 2>/dev/null || true
          cp -v logs/*.log  evidence/ 2>/dev/null || true
          cp -v logs/*.txt  evidence/ 2>/dev/null || true
          cp -rv logs/yosys_reports evidence/ 2>/dev/null || true
          cat > evidence/README_EVIDENCE.txt <<'EOF'
          Evidence bundle produced by GitHub Actions.
            01_frontend_verilator_compile.png ... frontend compile proof
            02_frontend_helloworld_run.png ...... frontend run proof (Hello World from Croc!)
            03_backend_yosys_synthesis.png ...... backend synthesis proof
            frontend_*.log / backend_*.log ...... full terminal stdout of each step
            yosys_reports/ ..................... area / register / instance reports
          EOF
          du -sh evidence

      - name: 13. Upload logs and images as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croc-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
