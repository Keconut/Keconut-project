name: Croc frontend + backend

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/croc_test.yml'
      - 'Croc_chip/**'

permissions:
  contents: read

env:
  # The exact upstream revision from the failing run, not a moving branch.
  CROC_REF: b301ef4439ab9b55322d2ac31d672fdcc67bc0c6
  BENDER_VERSION: v0.32.1
  OSS_CAD_RELEASE: '2026-09-19'

jobs:
  croc:
    name: Verilator helloworld + Yosys synthesis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout the pinned Croc source
        id: source
        uses: actions/checkout@v4
        with:
          repository: pulp-platform/croc
          ref: ${{ env.CROC_REF }}
          path: croc
          persist-credentials: false
          # RTL and synthesis use the vendored RTL and ihp13/pdk mirror.
          # The large KLayout/GDS submodules are not required for this task.
          submodules: false

      - name: Install tools
        id: tools
        run: |
          set -euo pipefail
          mkdir -p logs tools/bender
          git -C croc rev-parse HEAD | tee logs/croc_commit.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl xz-utils gawk python3 \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf \
            liblz4-dev zlib1g-dev

          curl -fL --retry 3 \
            "https://github.com/pulp-platform/bender/releases/download/${BENDER_VERSION}/bender-x86_64-unknown-linux-gnu.tar.xz" \
            -o tools/bender.tar.xz
          tar -xJf tools/bender.tar.xz -C tools/bender
          bender_bin="$GITHUB_WORKSPACE/tools/bender/bender-x86_64-unknown-linux-gnu"
          test -x "$bender_bin/bender"
          echo "$bender_bin" >> "$GITHUB_PATH"

          archive_date="${OSS_CAD_RELEASE//-/}"
          curl -fL --retry 3 \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_RELEASE}/oss-cad-suite-linux-x64-${archive_date}.tgz" \
            -o tools/oss-cad-suite.tgz
          tar -xzf tools/oss-cad-suite.tgz -C tools
          rm tools/oss-cad-suite.tgz
          suite_bin="$GITHUB_WORKSPACE/tools/oss-cad-suite/bin"
          echo "$suite_bin" >> "$GITHUB_PATH"
          # Use the suite's executable wrappers. Do not export its lib/ as
          # LD_LIBRARY_PATH for host programs.
          {
            "$bender_bin/bender" --version
            "$suite_bin/verilator" --version
            "$suite_bin/yosys" -V
            riscv64-unknown-elf-gcc --version
            riscv64-unknown-elf-ld --version
          } | tee logs/tool_versions.txt
          "$suite_bin/yosys" -Q -T -p 'plugin -i slang.so; help read_slang' \
            > logs/slang-check.log 2>&1

      - name: Fix stack pointer initialization before GP is valid
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('croc/sw/crt0.S')
          old = '''_start:
            la      sp, __stack_pointer$
            .option push
            .option norelax
            la      gp, __global_pointer$
          '''
          new = '''_start:
            .option push
            .option norelax
            # GP is not initialized yet: neither address load may be GP-relative.
            la      sp, __stack_pointer$
            la      gp, __global_pointer$
          '''
          text = p.read_text()
          if text.count(old) != 1:
              raise SystemExit('Unexpected crt0.S: inspect upstream before applying this patch')
          p.write_text(text.replace(old, new, 1))
          PY
          git -C croc diff -- sw/crt0.S | tee logs/crt0.patch

      - name: Cross-compile helloworld
        run: |
          set -euo pipefail
          # This freestanding example and its support files do not use libm.
          # Keep libgcc; avoid an unnecessary picolibc/compiler wrapper.
          make -C croc/sw bin/helloworld.hex bin/helloworld.dump \
            RISCV_LDFLAGS='-static -nostartfiles -lgcc $(RISCV_FLAGS)' \
            2>&1 | tee logs/software-build.log
          test -s croc/sw/bin/helloworld.hex
          riscv64-unknown-elf-objdump -d -j .text._start \
            croc/sw/bin/helloworld.elf | tee logs/startup-disassembly.txt

      - name: Adapt synthesis to the pinned OSS CAD Suite
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('croc/yosys/scripts/yosys_synthesis.tcl')
          text = p.read_text()
          for option in ('--compat-mode ', ' --ignore-unknown-modules'):
              if text.count(option) != 1:
                  raise SystemExit(f'Unexpected synthesis script: {option!r}')
              text = text.replace(option, '', 1)
          old = 'yosys abc {*}$tech_cells_args'
          if text.count(old) != 1:
              raise SystemExit('Unexpected ABC invocation')
          # Invoke the suite wrapper so its runtime libraries are loaded.
          text = text.replace(old, 'yosys abc -exe yosys-abc {*}$tech_cells_args', 1)
          p.write_text(text)
          PY
          # init_tech_sg13cmos5l.tcl already reads the technology Liberty
          # blackboxes before read_slang. Unknown modules should be errors.
          git -C croc diff -- yosys/scripts/yosys_synthesis.tcl \
            | tee logs/synthesis-tools.patch

      - name: Build Verilator simulation
        run: |
          set -euo pipefail
          cd croc/verilator
          VERILATOR_JOBS=4 ./run_verilator.sh --build \
            > "$GITHUB_WORKSPACE/logs/verilator-build.log" 2>&1 || {
              tail -n 100 "$GITHUB_WORKSPACE/logs/verilator-build.log"
              exit 1
            }
          tail -n 15 "$GITHUB_WORKSPACE/logs/verilator-build.log"
          test -x obj_dir_rtl/Vtb_croc_soc

      - name: Run and verify helloworld
        run: |
          set -euo pipefail
          cd croc/verilator
          log="$GITHUB_WORKSPACE/logs/helloworld-run.log"
          if timeout --kill-after=10s 120s ./run_verilator.sh \
              --run ../sw/bin/helloworld.hex > "$log" 2>&1; then
            rc=0
          else
            rc=$?
          fi
          tail -n 60 "$log"
          echo "Simulation exit status: $rc"
          test "$rc" -eq 0
          grep -Fq '[UART] Hello World from Croc!' "$log"
          grep -Fq '[JTAG] Simulation finished: SUCCESS' "$log"
          if grep -Eq 'Illegal instruction|Simulation finished: FAIL|%Error' "$log"; then
            echo 'Unexpected simulation error' >&2
            exit 1
          fi
          echo '[FRONTEND] PASSED'

      - name: Run and verify Yosys synthesis
        # Let synthesis diagnose its own result even if frontend verification fails.
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd croc/yosys
          ./run_synthesis.sh --synth \
            > "$GITHUB_WORKSPACE/logs/yosys-synthesis.log" 2>&1 || {
              tail -n 100 "$GITHUB_WORKSPACE/logs/yosys-synthesis.log"
              exit 1
            }
          tail -n 30 "$GITHUB_WORKSPACE/logs/yosys-synthesis.log"
          test -s out/croc_yosys.v
          test -s out/netlist_debug.v
          test -s reports/croc_area.rpt
          grep -Fq 'Found and reported 0 problems.' reports/croc_synth.rpt
          tail -n 35 reports/croc_area.rpt
          echo '[BACKEND] PASSED'

      - name: Upload actual logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croc-evidence
          path: |
            logs/
            croc/sw/bin/helloworld.*
            croc/yosys/out/*.v
            croc/yosys/reports/*.rpt
            croc/yosys/croc.log
          if-no-files-found: warn
          retention-days: 30
