name: Croc frontend + backend

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/croc_test.yml'

permissions:
  contents: read

jobs:
  croc:
    name: Verilator helloworld + Yosys synthesis
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      CROC_REPO: https://github.com/pulp-platform/croc.git
      CROC_REF: main

    steps:
      - name: 0. Checkout this repository
        uses: actions/checkout@v4

      - name: 1. Install system packages (Use the complete toolchain)
        shell: bash
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl wget xz-utils \
            verilator yosys \
            gcc-riscv64-linux-gnu \
            libnewlib-dev \
            make gawk

      - name: 2. Clone Croc repository
        shell: bash
        run: |
          set -x
          git clone --depth 1 --branch ${{ env.CROC_REF }} ${{ env.CROC_REPO }} croc
          cd croc
          git rev-parse HEAD

      - name: 3. Build RTL file list (With Bender)
        shell: bash
        run: |
          set -x
          cd croc
          # 下载 Bender
          curl -fSL -o /tmp/bender.tar.gz https://github.com/pulp-platform/bender/releases/download/v0.32.1/bender-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p $HOME/.local/bin
          tar -xzf /tmp/bender.tar.gz -C $HOME/.local/bin
          chmod +x $HOME/.local/bin/bender
          export PATH=$HOME/.local/bin:$PATH
          bender script verilator > croc/verilator/croc_rtl.f

      - name: 4. Run Verilator simulation (Frontend)
        shell: bash
        run: |
          set -x
          cd croc/verilator
          make verilator
          make helloworld

      - name: 5. Run Yosys synthesis (Backend)
        shell: bash
        run: |
          set -x
          cd croc/verilator
          make yosys

      - name: 6. Show simulation logs
        shell: bash
        run: |
          echo "====== Simulator output ======"
          find croc/verilator -name "*.log" -exec cat {} +
